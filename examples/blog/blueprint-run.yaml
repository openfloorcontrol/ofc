name: blog-coder
description: "Single coder agent for blog post experiments"

defaults:
  model: "@ofc-test"   # the mf model tagged ofc-test (mf set <name> tags ofc-test)

agents:
  - id: "@code"
    name: "Coder"
    activation: always
    temperature: 0.2
    furniture: [sandbox]
    prompt_file: owning-datascientist.txt

furniture:
  - name: sandbox
    type: sandbox
    image: python:3.11-slim
    dockerfile: ./sandbox/Dockerfile
    workspace: ./workspace
