name: blog-coder
description: "Single coder agent for blog post experiments"

models:
  glm:
    endpoint: http://localhost:11434/v1
    model: glm-4.7:cloud

defaults:
  model: glm

agents:
  - id: "@code"
    name: "Coder"
    activation: always
    temperature: 0.2
    furniture: [sandbox]
    prompt_file: owning-datascientist.txt

furniture:
  - name: sandbox
    type: sandbox
    image: python:3.11-slim
    dockerfile: ./sandbox/Dockerfile
    workspace: ./workspace
