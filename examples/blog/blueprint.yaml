name: blog-coder
description: "Single coder agent for blog post experiments"

defaults:
  endpoint: http://localhost:11434/v1
  model: glm-4.7:cloud

agents:
  - id: "@code"
    name: "Coder"
    activation: always
    temperature: 0.2
    furniture: [sandbox]
    prompt_file: prompt.txt

furniture:
  - name: sandbox
    type: sandbox
    image: python:3.11-slim
    dockerfile: ./sandbox/Dockerfile
    workspace: ./workspace
